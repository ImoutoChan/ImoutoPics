services:
  imoutopics:
    restart: always
    image: imoutochan/imoutopics:latest
    networks:
      - customnetwork
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "127.0.0.1:42427:8080"
    volumes:
      - ./idata:/app/idata
      

networks:
  customnetwork:
     driver: bridge
